<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контур 3: Тёплый Пол 2 Этаж</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #060911; color: #f1f5f9; }
        .glass-card { background: rgba(26, 36, 56, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen pb-12 pt-4">

    <header class="max-w-[1400px] mx-auto px-4 mb-4">
        <div class="glass-card p-4 rounded-2xl flex flex-wrap items-center justify-between gap-4 shadow-xl">
            <div class="flex items-center gap-4">
                <a href="index.html" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl border border-slate-700 text-xs font-bold transition flex items-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> Дашборд
                </a>
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-teal-600/30 border border-teal-500/50 flex items-center justify-center text-teal-400 text-xl font-bold">
                        <i class="fa-solid fa-border-all"></i>
                    </div>
                    <div>
                        <h1 class="text-base font-extrabold text-white flex items-center gap-2">
                            Контур 3: Тёплый Пол (2 Этаж)
                        </h1>
                        <p class="text-[11px] text-slate-400">Защита стяжки спальной зоны и уставка смесителя</p>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <div id="mqttBadge" class="px-3 py-1.5 rounded-xl border border-amber-500/40 bg-amber-950/30 text-amber-400 text-xs font-bold flex items-center gap-2">
                    <span id="mqttDot" class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
                    <span id="mqttStatusText">MQTT: Подключение...</span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-[1400px] mx-auto px-4 space-y-6">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- SETPOINT & SCREED SENSOR -->
            <div class="glass-card p-6 rounded-3xl space-y-5">
                <h2 class="text-sm font-bold text-white uppercase tracking-wider border-b border-slate-800 pb-3 flex items-center gap-2">
                    <i class="fa-solid fa-temperature-arrow-down text-teal-400"></i> Уставка Смесителя ТП 2
                </h2>

                <div class="p-4 bg-slate-900/90 rounded-2xl border border-slate-800 space-y-3">
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-slate-300 font-semibold">Уставка смесителя ТП2:</span>
                        <span id="dispC3Set" class="font-mono font-bold text-teal-400 text-lg">35.0 °C</span>
                    </div>
                    <input type="range" id="sliderC3Set" min="20" max="50" value="35" step="1" oninput="updateC3Set(this.value)" class="w-full accent-teal-500">
                </div>

                <div class="p-4 bg-slate-900/90 rounded-2xl border border-slate-800 flex justify-between items-center">
                    <div>
                        <span class="text-xs text-slate-400 font-semibold block">Датчик температуры стяжки:</span>
                        <strong class="text-teal-400 font-mono text-lg">26.0 °C</strong>
                    </div>
                    <span class="text-xs font-bold text-teal-400 bg-teal-950 px-3 py-1 rounded-full border border-teal-800">БЕЗОПАСНО</span>
                </div>
            </div>

            <!-- NIGHT TIMER -->
            <div class="glass-card p-6 rounded-3xl space-y-5">
                <h2 class="text-sm font-bold text-white uppercase tracking-wider border-b border-slate-800 pb-3 flex items-center gap-2">
                    <i class="fa-solid fa-moon text-indigo-400"></i> Суточный Таймер Спальной Зоны
                </h2>

                <div class="p-4 bg-slate-900/90 rounded-2xl border border-slate-800 space-y-2">
                    <div class="flex justify-between items-center text-xs">
                        <span class="text-slate-300 font-semibold">Ночной интервал:</span>
                        <span class="font-mono font-bold text-indigo-400">22:00 – 07:00</span>
                    </div>
                    <div class="flex justify-between items-center text-xs border-t border-slate-800 pt-2">
                        <span class="text-slate-300 font-semibold">Дельта снижения:</span>
                        <span class="font-mono font-bold text-indigo-400">-4.0 °C</span>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <script>
        let cfg = { host: "m4.wqtt.ru", port: 6247, prefix: "home/heating", user: "didrik", password: "7777777" };
        try {
            const saved = localStorage.getItem('mqtt_heating_config');
            if (saved) cfg = { ...cfg, ...JSON.parse(saved) };
        } catch(e) {}

        const client = mqtt.connect(`wss://${cfg.host}:${cfg.port}/mqtt`, {
            username: cfg.user,
            password: cfg.password,
            clientId: 'c3_page_' + Math.random().toString(16).substr(2, 8)
        });

        client.on('connect', () => {
            document.getElementById('mqttStatusText').innerText = 'MQTT: Подключено';
            document.getElementById('mqttDot').className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse';
            client.subscribe(`${cfg.prefix}/#`);
        });

        client.on('message', (topic, payload) => {
            const val = payload.toString();
            if (topic.endsWith('circuits/c3/setpoint')) {
                document.getElementById('dispC3Set').innerText = parseFloat(val).toFixed(1) + ' °C';
                document.getElementById('sliderC3Set').value = val;
            }
        });

        function updateC3Set(val) {
            document.getElementById('dispC3Set').innerText = parseFloat(val).toFixed(1) + ' °C';
            client.publish(`${cfg.prefix}/circuits/c3/setpoint/set`, String(val), { retain: true });
        }
    </script>
</body>
</html>
